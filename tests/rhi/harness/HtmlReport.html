<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Metallic test report</title>
<style>
:root{--bg:#0e1117;--panel:#171c24;--line:#2b3442;--muted:#94a3b8;--text:#e6edf7;--blue:#70a9ff;--green:#5ddb98;--red:#ff7a83;--amber:#efbf67;--mono:Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{cursor:pointer}header{padding:24px 28px 18px;background:#141922;border-bottom:1px solid var(--line)}.top{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}.eyebrow{color:var(--blue);font:11px var(--mono);letter-spacing:2px;margin-bottom:8px}h1{font-size:25px;font-weight:650;margin:0}#device{color:var(--muted);font-size:12px;margin-top:8px;max-width:1100px;line-height:1.6}.counts{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag{border:1px solid var(--line);border-radius:6px;background:#202733;padding:6px 10px;color:var(--muted);font-size:12px;white-space:nowrap}.pill b{font:600 18px var(--mono);margin-right:5px}.pass{color:var(--green)}.fail{color:var(--red)}.skip{color:var(--amber)}.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:20px}input,select{border:1px solid var(--line);border-radius:6px;background:#1b222d;color:var(--text);padding:9px 10px}input{min-width:260px;flex:1;max-width:480px}label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}select{max-width:205px;font-size:12px;text-transform:none}#reset,.quiet{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);padding:8px 12px}#state{margin:18px 28px 0;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:16px;flex-wrap:wrap}.incomplete{color:var(--amber)!important}main{padding:18px 28px 28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px;padding:16px;text-align:left;color:var(--text);min-height:212px;width:100%;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,background .15s;overflow:hidden}.card:hover,.card:focus-visible{border-color:var(--blue);background:#1b2330}.card.fail-card{border-left-color:var(--red)}.card.skip-card{border-left-color:var(--amber)}.card-top{display:flex;gap:12px;align-items:start;justify-content:space-between}.case-name{font-size:13px;font-weight:650;line-height:1.5;overflow-wrap:anywhere;margin:0}.time{font:11px var(--mono);color:var(--muted);white-space:nowrap;padding-top:3px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;padding:3px 6px}.preview{display:flex;align-items:center;justify-content:space-around;gap:10px;min-height:86px}.preview figure{margin:0;flex:1;min-width:0;text-align:center}.preview img,.preview canvas{width:100%;height:80px;object-fit:contain;image-rendering:pixelated;border-radius:4px;background:repeating-conic-gradient(#202733 0% 25%,#151a22 0% 50%) 50%/12px 12px}.preview figcaption{font:9px var(--mono);color:var(--muted);text-transform:uppercase;margin-top:5px}.bar{height:14px;display:flex;gap:1px;border-radius:3px;overflow:hidden;background:#313c4c}.bar i{flex:1;background:#354154}.bar i.bad{background:var(--red)}.buffer-caption{display:flex;justify-content:space-between;gap:8px;font:10px var(--mono);color:var(--muted);margin-top:7px}.card-bottom{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-top:auto}.explain{color:var(--muted);font-size:12px;line-height:1.6;margin:0}.message{color:var(--red);font-size:11px;max-height:48px;overflow:hidden;white-space:pre-wrap}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.footer{padding:0 28px 22px;color:var(--muted);font-size:11px}.footer a{color:var(--muted)}dialog{background:var(--bg);color:var(--text);border:1px solid #42516a;border-radius:12px;width:min(1100px,94vw);max-height:90vh;padding:0;box-shadow:0 20px 90px #000a}dialog::backdrop{background:#000b}dialog .heading{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:flex-start}dialog h2{font-size:19px;margin:0;overflow-wrap:anywhere}#close{font-size:22px;line-height:1;padding:3px 8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:13px 16px}.tabs button[aria-selected=true]{border-color:var(--blue);color:var(--blue)}#detail-body{padding:24px;min-height:250px}#detail-body .preview{justify-content:flex-start;margin:20px 0}#detail-body .preview img,#detail-body .preview canvas{height:200px}#detail-body .preview figure{max-width:460px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.fact{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px}.fact small{display:block;color:var(--muted);margin-bottom:7px;font-size:11px}.fact strong{font-size:13px;font-weight:500;overflow-wrap:anywhere}.notice{white-space:pre-wrap;overflow-wrap:anywhere;background:#2d211a;border:1px solid #614832;padding:12px;border-radius:6px;color:var(--amber);line-height:1.6;margin:12px 0}.hex{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.hex pre,pre{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:400px;font:11px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}details{margin:12px 0}summary{cursor:pointer;color:var(--blue);padding:6px 0}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-size:11px}.section-title{font-size:13px;margin:22px 0 10px}#case-link{display:inline-block;margin-top:12px}.no-script{padding:24px;color:var(--amber)}@media(max-width:600px){header{padding:18px}main{padding:16px}#state{margin:16px}.grid{grid-template-columns:1fr}.counts .pill b{font-size:15px}input{min-width:100%;max-width:none}label{flex:1}select{max-width:150px}.hex{grid-template-columns:1fr}dialog .heading{padding:18px}#detail-body{padding:16px}.tabs button{padding:12px 8px}}
</style></head><body>
<header><div class="top"><div><div class="eyebrow">METALLIC / RHI</div><h1>Test report</h1><div id="device"></div></div><div id="counts" class="counts"></div></div>
<div class="filters"><input id="search" aria-label="Filter tests by name" placeholder="Filter by name, coverage or message…"><label>Status <select id="status"></select></label><label>Kind <select id="kind"></select></label><label>Layer <select id="layer"></select></label><label>Profile <select id="profile"></select></label><label>Sort <select id="sort"><option value="default">Failures first</option><option value="name">Name</option><option value="duration">Duration</option></select></label><button id="reset">Reset</button></div></header>
<div id="state"><span id="visible-count"></span><span id="run-state"></span></div><main><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>No matching tests. Clear a filter to see more results.</div></main>
<div class="footer">Case durations are CPU wall time, not GPU timings. Byte previews do not replace each test's oracle. Raw thumbnails show RGB; channels can be changed in details. · Layout inspired by <a href="https://github.com/AmelieHeinrich/agfx/tree/main/tools/test_report" target="_blank" rel="noopener noreferrer">agfx</a></div>
<dialog id="detail" aria-labelledby="detail-name"><div class="heading"><div><h2 id="detail-name"></h2><div id="detail-subtitle" class="explain"></div><a id="case-link" target="_blank" rel="noopener noreferrer">Open case report ↗</a></div><button id="close" class="quiet" aria-label="Close details">×</button></div><div class="tabs" role="tablist"><button role="tab" data-tab="overview">Overview</button><button role="tab" data-tab="evidence">Evidence</button><button role="tab" data-tab="validation">Validation</button><button role="tab" data-tab="diagnostics">Diagnostics</button></div><div id="detail-body"></div></dialog>
<noscript><p class="no-script">Enable JavaScript to inspect this offline report. Authoritative verdicts remain in results.json / parent-result.json.</p></noscript>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent), cases=report.cases;
const $=id=>document.getElementById(id), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const group=c=>c.failed||c.policyFailure?'Failed':c.status==='Pass'?'Passed':c.status.startsWith('Skip')||c.status==='Skipped'?'Skipped':'Other';
const color=c=>group(c)==='Failed'?'fail':group(c)==='Skipped'?'skip':'pass';
const fmt=n=>n===null||n===undefined?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:1});
const duration=c=>c.durationMs===null?'—':fmt(c.durationMs)+' ms';
const safeHref=href=>typeof href==='string'&&!/^(?:[a-z][a-z0-9+.-]*:|\/\/|\\)/i.test(href);
function link(href,text){if(!safeHref(href))return el('span','',text);const a=el('a','',text);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
const counts={Passed:0,Failed:0,Skipped:0,Other:0};cases.forEach(c=>counts[group(c)]++);
for(const [key,cls] of [['Passed','pass'],['Failed','fail'],['Skipped','skip']]){const p=el('div','pill '+cls);p.append(el('b','',counts[key]),document.createTextNode(key.toLowerCase()));$('counts').append(p)}
$('counts').append(el('div','pill',fmt(report.run.durationMs)+' ms · wall'));
const devices=[...new Set(cases.map(c=>c.device).filter(v=>v!=='Unavailable'))];
$('device').textContent=(devices.join(' / ')||'Device information unavailable')+' · '+(report.run.mode||'testbench')+' · '+report.generatedUtc;
if(report.run.completionStatus)$('device').textContent+=' · '+report.run.completionStatus;
$('run-state').textContent=report.complete?'Completed · '+cases.length+' result entries':'Incomplete / running snapshot · '+cases.length+' recorded'+(report.run.planned?' / '+report.run.planned+' planned':'');
if(!report.complete)$('run-state').classList.add('incomplete');
function choices(id,values){const s=$(id);s.append(new Option('All',''));[...new Set(values)].sort().forEach(v=>s.append(new Option(v,v)))}
choices('status',cases.map(group));choices('kind',cases.map(c=>c.kind));choices('layer',cases.map(c=>c.layer));choices('profile',cases.map(c=>c.profile));
const imageCache=new WeakMap();
let previewChannels='rgb';
function image(value){if(value.src){const img=el('img');img.src=value.src;img.alt='Test output preview';return img}const canvas=el('canvas');canvas.width=value.width;canvas.height=value.height;canvas.setAttribute('role','img');canvas.setAttribute('aria-label','RGBA8 test output '+value.width+' by '+value.height);let pixels=imageCache.get(value);if(!pixels){pixels=Uint8ClampedArray.from(atob(value.rgba),c=>c.charCodeAt(0));imageCache.set(value,pixels)}const display=pixels.slice();for(let i=0;i<display.length;i+=4){if(previewChannels==='alpha')display[i]=display[i+1]=display[i+2]=pixels[i+3];if(previewChannels!=='rgba')display[i+3]=255}canvas.getContext('2d').putImageData(new ImageData(display,value.width,value.height),0,0);return canvas}
function previews(pair){const row=el('div','preview');for(const key of ['actual','expected'])if(pair[key]){const f=el('figure');f.append(image(pair[key]),el('figcaption','',(key==='actual'?'Output':'Expected')+(pair[key].rgba?' · '+previewChannels.toUpperCase():'')));row.append(f)}return row}
function bufferPreview(b){const box=el('div'),bar=el('div','bar');bar.title=fmt(b.differentBytes)+' differing bytes';b.bins.forEach(v=>bar.append(el('i',v?'bad':'')));const caption=el('div','buffer-caption');caption.append(el('span','',fmt(b.actualBytes)+' B'),el('span',b.differentBytes?'fail':'pass',b.differentBytes?fmt(b.differentBytes)+' differing bytes':'byte-identical'));box.append(bar,caption);return box}
function render(){let filtered=cases.map((c,i)=>({c,i})).filter(({c})=>{const query=$('search').value.toLowerCase();return (!query||(c.id+' '+c.message+' '+c.coverage.join(' ')).toLowerCase().includes(query))&&(!$('status').value||group(c)===$('status').value)&&['kind','layer','profile'].every(key=>!$(key).value||c[key]===$(key).value)});
const rank=c=>group(c)==='Failed'?0:group(c)==='Skipped'?1:2;
filtered.sort((a,b)=>$('sort').value==='name'?a.c.id.localeCompare(b.c.id):$('sort').value==='duration'?(b.c.durationMs??-1)-(a.c.durationMs??-1):rank(a.c)-rank(b.c)||a.i-b.i);
$('grid').replaceChildren();$('visible-count').textContent=filtered.length+' of '+cases.length+' results';$('empty').hidden=filtered.length>0;
for(const {c,i} of filtered){const card=el('button','card '+(color(c)==='pass'?'':color(c)+'-card'));card.type='button';card.title=c.id;card.setAttribute('aria-label',c.id+', '+c.status);const top=el('div','card-top');top.append(el('h3','case-name',c.id.replace(/^Rhi\w+\./,'')),el('span','time',duration(c)));const tags=el('div','tags');for(const t of [c.kind,c.layer,c.profile,c.variant,'#'+c.iteration].filter(Boolean))tags.append(el('span','tag',t));card.append(top,tags);if(c.images.length)card.append(previews(c.images[0]));else if(c.buffers.length)card.append(bufferPreview(c.buffers[0]));else card.append(el('p','explain',c.status==='Pass'?'Contract and execution evidence available.':c.message||'No preview artifact was produced.'));if(c.message&&group(c)!=='Passed')card.append(el('div','message',c.message));const bottom=el('div','card-bottom');bottom.append(el('span',color(c),c.status+(c.policyFailure?' · require-all':'')),el('span','explain',c.validation.count!==undefined?c.validation.count+' validation messages':'Validation not recorded'));card.append(bottom);card.onclick=()=>openDetail(i);$('grid').append(card)}}
let selected=0;
function fact(box,label,value){const item=el('div','fact');item.append(el('small','',label),el('strong','',value));box.append(item)}
function hex(bytes,offset){let text='';for(let i=0;i<bytes.length;i+=16)text+=(offset+i).toString(16).padStart(8,'0')+'  '+bytes.slice(i,i+16).map(v=>v.toString(16).padStart(2,'0')).join(' ')+'\n';return text||'No bytes in this range.'}
function diagnostic(parent,name,text){const d=el('details');d.append(el('summary','',name),el('pre','',text));parent.append(d)}
function showTab(tab){const c=cases[selected],body=$('detail-body');body.replaceChildren();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
if(tab==='overview'){const facts=el('div','facts');fact(facts,'Verdict',c.status+(c.policyFailure?' / require-all failure':''));fact(facts,'Executed',c.executed?'Yes':'No');fact(facts,'Profile / iteration',c.profile+' / '+c.iteration);fact(facts,'Duration',duration(c));fact(facts,'Measurement',c.durationScope);fact(facts,'Seed',c.seed??'Not recorded');fact(facts,'Device',c.device);fact(facts,'Driver',c.driver||'Not recorded');body.append(facts);if(c.message)body.append(el('div','notice',c.message));for(const warning of c.warnings)body.append(el('div','notice',warning));if(c.images.some(pair=>pair.actual.rgba)){const label=el('label','','Raw preview channels '),select=el('select');select.setAttribute('aria-label','Raw preview channels');for(const [value,name] of [['rgb','RGB · ignore alpha'],['rgba','RGBA · transparency'],['alpha','Alpha · grayscale']])select.append(new Option(name,value));select.value=previewChannels;select.onchange=()=>{previewChannels=select.value;render();showTab('overview')};label.append(select);body.append(label)}for(const pair of c.images){body.append(el('h3','section-title',pair.label),previews(pair))}for(const b of c.buffers){body.append(el('h3','section-title',b.actual+' ↔ '+b.expected),bufferPreview(b));body.append(el('p','explain','Expected '+fmt(b.expectedBytes)+' B · '+(b.firstMismatch===null?'No byte mismatch':'First mismatch at byte '+b.firstMismatch)));const row=el('div','hex');const actual=el('div'),expected=el('div');actual.append(el('h4','section-title','Output bytes'),el('pre','',hex(b.actualSample,b.sampleOffset)));expected.append(el('h4','section-title','Expected bytes'),el('pre','',hex(b.expectedSample,b.sampleOffset)));row.append(actual,expected);body.append(row)}if(c.coverage.length)diagnostic(body,'Coverage claims',c.coverage.join('\n'))}
else if(tab==='evidence'){body.append(el('p','explain','Previews are embedded. Original artifact links require keeping this report with its output directory.'));const table=el('table'),head=el('tr');head.append(el('th','','Artifact'),el('th','','Size'));table.append(head);for(const f of c.artifacts){const row=el('tr'),cell=el('td');cell.append(link(f.href,f.name));row.append(cell,el('td','',fmt(f.bytes)+' B'));table.append(row)}body.append(table)}
else if(tab==='validation'){body.append(el('p','explain','Mode: '+c.validationMode+' · '+(c.validation.count??'Unknown')+' messages'+(c.validation.captureFailed?' · CAPTURE FAILED':'')));const messages=c.validation.messages||[];for(const m of messages){const title=[m.phase,m.id].filter(Boolean).join(' / ');diagnostic(body,title||'Validation message',JSON.stringify(m,null,2))}if(!messages.length)body.append(el('p','explain',c.validation.count===0?'Recorder observed zero messages. This does not imply full coverage of all GPU accesses.':'No inline validation messages; inspect the original artifact.'))}
else{if(c.trace)body.append(el('p','explain','Backend trace: '+c.trace.events+' events · limit '+c.trace.eventLimit+(c.trace.captureFailed?' · CAPTURE FAILED':'')));for(const [name,text] of Object.entries(c.details))diagnostic(body,name,text)}
}
function openDetail(i){selected=i;const c=cases[i];$('detail-name').textContent=c.id;$('detail-subtitle').textContent=c.layer+' · '+c.profile+' · '+c.status;$('case-link').hidden=!safeHref(c.casePage);if(safeHref(c.casePage))$('case-link').href=c.casePage;showTab('overview');$('detail').showModal()}
$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));['search','status','kind','layer','profile','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=()=>{['search','status','kind','layer','profile'].forEach(id=>$(id).value='');$('sort').value='default';render()};render();
</script></body></html>
